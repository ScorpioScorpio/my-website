name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_run:
    # The feed workflows commit with GITHUB_TOKEN, and pushes made with that
    # token don't trigger other workflows' `push` events (GitHub's anti-loop
    # protection) — so without this, their commits would never actually go live.
    workflows: ["Update immigration news feed", "Check for urgent immigration alerts"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
