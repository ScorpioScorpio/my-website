name: Update immigration news feed

on:
  schedule:
    # Every 6 hours. Adjust as you like — cron is in UTC.
    - cron: "15 */6 * * *"
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run update script
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python scripts/update_feed.py

      - name: Commit updated feed if changed
        run: |
          git config user.name "feed-bot"
          git config user.email "actions@github.com"
          git add data/updates.json
          git diff --cached --quiet || git commit -m "Update immigration news feed [automated]"
          git pull --rebase
          git push
